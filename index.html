<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Weatherman — Flat Out</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="The Weatherman — Flat Out">
<meta property="og:image" content="weatherman-cover.jpg">
<!--
  Flat Out round-2 Spotify page (v2, Nov 2026).
    1. Loads the Meta pixel ("Flat Out site") and fires PageView.
    2. "Listen on Spotify" fires ViewContent (what the ad optimizes for), then opens the Spotify APP
       from the tap itself: spotify: URI on iPhone (with a web fallback if the app doesn't open),
       an Android intent with a built-in browser fallback, and the normal web link elsewhere.
       v1 waited 250 ms and redirected to open.spotify.com, which inside Instagram's browser opens
       the logged-out web player instead of the app.
-->
<script>
  var PIXEL_ID = "1359317799389836";
  var TRACK_ID = "5lRfv9ZuZTer2lP720t81X";
  var WEB_URL = "https://open.spotify.com/track/" + TRACK_ID;
  var ARTIST_URL = "https://open.spotify.com/artist/5YkwretAI76aIwY8Inrtyr";
</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;text-align:center}
  main{padding:32px 20px;max-width:420px}
  .art{width:220px;height:220px;border-radius:14px;background:#222;margin:0 auto 18px;overflow:hidden}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-size:22px;margin:0 0 4px}
  p{color:#aaa;margin:0 0 22px}
  a.btn{display:block;background:#1DB954;color:#111;text-decoration:none;font-weight:700;padding:15px 18px;border-radius:999px;margin:0 0 14px;font-size:17px}
  a.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .follow{color:#bbb;font-size:14px;line-height:1.45;margin:0 0 14px}
  .follow a{color:#1DB954}
  small{color:#666;font-size:12px}
  small a{color:#888}
</style>
</head>
<body>
<main>
  <div class="art"><img src="weatherman-cover.jpg" alt="The Weatherman cover art" width="220" height="220"></div>
  <h1>The Weatherman</h1>
  <p>Flat Out</p>
  <a class="btn" id="spotify" href="https://open.spotify.com/track/5lRfv9ZuZTer2lP720t81X">Listen on Spotify</a>
  <div class="follow">Like it? Follow <a id="artist" href="https://open.spotify.com/artist/5YkwretAI76aIwY8Inrtyr">Flat Out on Spotify</a> so our next song lands in your Release Radar.</div>
  <small>Opens the Spotify app. App didn't open? <a id="web" href="https://open.spotify.com/track/5lRfv9ZuZTer2lP720t81X">Play in your browser</a>.</small>
</main>
<script>
  // Meta pixel base code (official snippet)
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
  s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function track(kind) {
    try { fbq('track', 'ViewContent', { content_name: 'The Weatherman', content_category: kind }); } catch (e) {}
  }

  // Everything below runs inside the tap handler itself, so iOS and Android treat it as the user's own action.
  function openInApp(path, webUrl) {
    if (isAndroid) {
      // Android: the intent opens the Spotify app, or falls back to the web link if it isn't installed.
      location.href = "intent://" + path + "#Intent;scheme=spotify;package=com.spotify.music;S.browser_fallback_url=" +
        encodeURIComponent(webUrl) + ";end";
      return;
    }
    if (isIOS) {
      // iPhone: try the app; if this page is still showing after a moment, the app didn't open, so use the web link.
      var left = false;
      function gone() { left = true; }
      document.addEventListener("visibilitychange", function () { if (document.hidden) gone(); }, { once: true });
      window.addEventListener("pagehide", gone, { once: true });
      window.addEventListener("blur", gone, { once: true });
      location.href = "spotify:" + path.replace(/\//g, ":");
      setTimeout(function () { if (!left && !document.hidden) location.href = webUrl; }, 2500);
      return;
    }
    // Desktop and everything else: the normal web link (give the pixel a moment first).
    setTimeout(function () { location.href = webUrl; }, 300);
  }

  document.getElementById("spotify").addEventListener("click", function (e) {
    e.preventDefault();
    track("spotify");
    openInApp("track/" + TRACK_ID, WEB_URL);
  });
  document.getElementById("artist").addEventListener("click", function (e) {
    e.preventDefault();
    try { fbq('trackCustom', 'SpotifyFollowTap'); } catch (err) {}
    openInApp("artist/5YkwretAI76aIwY8Inrtyr", ARTIST_URL);
  });
  document.getElementById("web").addEventListener("click", function () { track("spotify_web"); });
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1359317799389836&ev=PageView&noscript=1"></noscript>
</body>
</html>
